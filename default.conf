## Version 2025/05/31 - Changelog: https://github.com/linuxserver/docker-baseimage-alpine-nginx/commits/3.22/root/defaults/nginx/site-confs/default.conf.sample

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=120r/m;

map "$scheme:$http_x_forwarded_proto" $redirect_to_https {
    default 0;
    "http:" 1;
    "http:http" 1;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    if ($redirect_to_https) {
        return 301 https://$host$request_uri;
    }

    include /config/nginx/ssl.conf;

    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header Permissions-Policy;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 16 32k;
    fastcgi_busy_buffers_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Browser-level Basic Auth is intentionally disabled.
    # The custom frontend requires Chengzi session login before loading gallery data.
    # auth_basic "Shared Gallery";
    # auth_basic_user_file /config/nginx/.htpasswd;

    set $root /app/www/public;
    if (!-d /app/www/public) {
        set $root /config/www;
    }
    root $root;
    index index.html index.htm index.php;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~* ^/feed(?:/|$) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(?:data|php|plugins|vendor|storage)(?:/|$) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(?:\.env|.*\.(?:env|log|sql|sqlite|bak|backup|old|orig|save|swp|tmp))(?:$|[/?]) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/custom-gallery/.+\.(?:css|js|woff2?|png|svg|ico)$ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

location ^~ /custom-gallery/activity-uploads/ {
        return 404;
    }

    location ^~ /custom-gallery/activity-display/ {
        return 404;
    }

    location /custom-gallery/ {
        expires off;
        add_header Cache-Control "no-cache, max-age=0" always;
        try_files $uri $uri/index.html =404;
    }

    location = /uploads/ {
        return 404;
    }

    location ^~ /uploads/ {
        expires 7d;
        rewrite ^/uploads/(.+)$ /Pictures/$1 last;
    }

    location = /dist/ {
        return 404;
    }

    location ^~ /dist/ {
        expires 7d;
        try_files $uri =404;
    }

    location /build/assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /api/v2/Auth::login {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /api/v2/Photo {
        limit_req zone=upload_limit burst=60 nodelay;
        client_max_body_size 500m;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ^~ /api/v2/Activities {
        client_max_body_size 500m;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ^~ /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/_cf_image/(.+)\.(?:jpg|jpeg|png|webp|avif)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        rewrite ^/_cf_image/(.+)\.(?:jpg|jpeg|png|webp|avif)$ /image/$1 last;
    }

    location ^~ /image/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri $uri/ @cached_image;
    }

    location @cached_image {
        fastcgi_hide_header Cache-Control;
        fastcgi_hide_header Expires;
        fastcgi_hide_header Pragma;
        fastcgi_hide_header Set-Cookie;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Permissions-Policy;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
    }

    location = /up {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /gallery/myadmin {
        return 302 /gallery/myadmin/;
    }

    location = /gallery/myadmin/ {
        rewrite ^ /gallery/myadmin/index.html last;
    }

    location ^~ /gallery/myadmin/ {
        alias /app/www/public/myadmin/;
        add_header Cache-Control "no-store" always;
    }

    location = /myadmin {
        return 301 /gallery/myadmin/;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|webm|mov|woff2?|ttf|eot)$ {
        expires 30d;
        try_files $uri /index.php$is_args$args;
    }

    location = / {
        add_header Cache-Control "no-store" always;
        rewrite ^ /index.php last;
    }

    location = /gallery {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^(.+\.php)(.*)$ {
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
    }

    location ~ /\.ht {
        return 404;
    }
}
